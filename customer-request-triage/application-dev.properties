# camel-camunda is loaded as a SNAPSHOT while 4.19.0 is unreleased.
# Replace with a stable version (e.g. camel-camunda:4.19.0) once available.
camel.jbang.dependencies=camel-camunda:4.20

camel.server.enabled=true
camel.server.staticEnabled=true

# Camunda 8 SaaS connection
camunda.cluster-id={{env:CAMUNDA_CLUSTER_ID}}
camunda.region={{env:CAMUNDA_REGION:bru-2}}
camel.component.camunda.clusterId={{camunda.cluster-id}}
camel.component.camunda.region={{camunda.region}}
camel.component.camunda.clientId={{env:CAMUNDA_CLIENT_ID}}
camel.component.camunda.clientSecret={{env:CAMUNDA_CLIENT_SECRET}}

# OpenAI connection (used by the openai component)
# To enable LLM classification, export OPENAI_ENABLED=true along with
# OPENAI_API_KEY (and optionally OPENAI_BASE_URL / OPENAI_MODEL).
# Without these, the app falls back to keyword-based triage.
openai.enabled={{env:OPENAI_ENABLED:false}}
camel.component.openai.apiKey={{env:OPENAI_API_KEY:none}}
camel.component.openai.baseUrl={{env:OPENAI_BASE_URL:https://api.openai.com/v1}}
camel.component.openai.model={{env:OPENAI_MODEL:gpt-4o}}
